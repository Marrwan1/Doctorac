
  name: doctorac
  description: "A new Flutter project."

  # The following line prevents the package from being accidentally published to
  # pub.dev using `flutter pub publish`. This is preferred for private packages.
  publish_to: 'none' # Remove this line if you wish to publish to pub.dev

  # The following defines the version and build number for your application.
  # A version number is three numbers separated by a dot, like 1.2.43
  # followed by an optional build number separated by a +.
  # Both the version and the builder number may be overridden in flutter
  # build by specifying --build-name and --build-number, respectively.
  # In Android, build-name is used as versionName while build-number is used as versionCode.
  # Read more about Android versioning at https://developer.android.com/studio/publish/versioning
  # In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
  # Read more about iOS versioning at
  # https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
  # In Windows, build-name is used as the major, minor, and patch parts of the product and file versions.
  # The build number is used as the build suffix.

  version: 1.0.0+1

  environment:
    sdk: ^3.10.7

  # Dependencies specify other packages that your package needs in order to work.
  # To automatically upgrade your package dependencies to the latest versions,
  # consider running `flutter pub upgrade --major-versions`.
  # Alternatively, dependencies can be manually updated to the latest versions
  # available on pub.dev by running `flutter pub outdated`.

  dependencies:
    flutter:
      sdk: flutter

    # The following adds the Cupertino Icons font to your application.
    # Use with the CupertinoIcons class for iOS style icons.
    cupertino_icons: ^1.0.8

    # This package allows Flutter to render SVG images.
    flutter_svg: ^2.0.10

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_launcher_icons: ^0.14.4


    # The flutter_lints package below contains a set of recommended lints
    # to encourage good coding practices.
    flutter_lints: ^6.0.0

  # The following section is specific to Flutter packages.
  flutter:

    # The following line ensures that the Material Icons font is
    # included with your application, so that you can use the icons
    # in the material Icons class.
    uses-material-design: true

    # All project assets.
    # Make sure these folders exist in your project with the same names.

    assets:
      - assets/doctor-home-care-screen/icons/
      - assets/doctor-home-care-screen/images/

      - assets/home-care-screen/icons/
      - assets/home-care-screen/images/

      - assets/home-screen/icons/
      - assets/home-screen/images/

      - assets/home_care_doctor_details_screen/icons/
      - assets/home_care_doctor_details_screen/images/

      - assets/lab_tests_screen/icons/
      - assets/lab_tests_screen/images/

      - assets/login-screen/
      - assets/login-screen/icons/

      - assets/logo/

      - assets/pharmacy-home-screen/icons/
      - assets/pharmacy-home-screen/images/

      - assets/product-details-screen/icons/
      - assets/product-details-screen/images/

      - assets/product-listing-screen/icons/
      - assets/product-listing-screen/images/

      - assets/radiology-screen/icons/
      - assets/radiology-screen/images/

      - assets/search-results-screen/icons/
      - assets/search-results-screen/images/

      - assets/search-screen/icons/

      - assets/service-home-cares-creen/icons/
      - assets/service-home-cares-creen/icons/list/
      - assets/service-home-cares-creen/images/

      - assets/sign-up-screen/icons/

    # To add additional assets to your application, add an assets section
    # and list the paths to your asset files or folders.
    #
    # Example:
    # assets:
    #   - images/a_dot_burr.jpeg
    #   - images/a_dot_ham.jpeg

    # An image asset can refer to one or more resolution-specific variants,
    # see:
    # https://flutter.dev/to/resolution-aware-images

    # For details regarding assets from package dependencies, see:
    # https://flutter.dev/to/asset-from-package

    # To add custom fonts to your application, add a fonts section here,
    # in this flutter section.
    #
    # Example:
    # fonts:
    #   - family: Schyler
    #     fonts:
    #       - asset: fonts/Schyler-Regular.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
    #       - asset: fonts/Schyler-Bold.ttf
    #         weight: 700
    #
    # For details regarding fonts from package dependencies, see:
    # https://flutter.dev/to/font-from-package


  flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/logo/logo.svg"
    min_sdk_android: 21

